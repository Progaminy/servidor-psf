[pytest]
# testpaths restringe a coleta padrão a testes/ -- sem isto, "python3 -m
# pytest -q" (o comando oficial documentado em COMO_RODAR.md) tenta
# recolher também cao_de_caca/PSF-Calculadora/tests/, um subprojeto
# separado com o seu próprio pyproject.toml, que falha ao importar
# "assistente_psf" a partir da raiz do PSF-IAminy. cao_de_caca/ continua
# testável por conta própria (com o seu próprio pyproject.toml/pytest
# rodado de dentro da sua pasta); isto só corrige a coleta padrão daqui.
testpaths = testes
