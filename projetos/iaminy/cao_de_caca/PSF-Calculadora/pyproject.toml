[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psf-calculadora"
version = "1.0.0"
description = "Calculadora matemática extensível em português"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "PSF"}]
dependencies = []

[project.optional-dependencies]
completo = [
  "numpy>=1.24", "sympy>=1.12", "pandas>=2.0", "matplotlib>=3.7",
  "scipy>=1.10", "networkx>=3.0", "mpmath>=1.3", "scikit-learn>=1.3",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
psf-calculadora = "psf_calculadora.__main__:main"

[tool.setuptools]
py-modules = ["assistente_psf"]

[tool.setuptools.packages.find]
include = ["psf_calculadora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
